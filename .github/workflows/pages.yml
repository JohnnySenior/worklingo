# Saytni GitHub Pages ga chiqaradi.
# Hech narsa "build" qilinmaydi — fayllar borligicha ko'chiriladi.
# main branchga push qilinsa, 1-2 daqiqada sayt yangilanadi.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages hali yoqilmagan bo'lsa, shu qadam o'zi yoqadi
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Sayt fayllarini yig'ish
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          echo "--- chiqadigan fayllar ---"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
